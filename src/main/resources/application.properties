spring.profiles.active=initlocal
# Banner
spring.banner.location=banner.txt
kode.ai.auto-generate-studyplan=true
# Subida de imágenes (OCR) — por defecto Spring limita a 1MB y una foto pesa más.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
# Dynamic API version
vs=v1
# Webservice URLs
# ===================== USERS =====================
url.users=/${vs}/users
url.users.signup=/${vs}/users/signup
url.login=/${vs}/users/login
url.unsecure=${vs}/unsecure
# ===================== ROLES =====================
url.roles=/${vs}/roles
# ===================== PRIVILEGES =====================
url.privileges=/${vs}/privileges
# ===================== TASKS =====================
url.tasks=/${vs}/tasks
# ===================== REMINDERS =====================
url.reminders=/${vs}/reminders
# ===================== PRIORITIES =====================
url.priorities=/${vs}/priorities
# ===================== STATUSES =====================
url.statuses=/${vs}/statuses
# ===================== TOPICS =====================
url.topics=/${vs}/topics
# ===================== NOTES (Apuntes) =====================
url.notes=/${vs}/notes
# ===================== QUESTIONS =====================
url.questionOptions=/${vs}/question-options
# ===================== COURSES / RUBRICS / ENROLLMENTS / CLASSES =====================
url.courses=/${vs}/courses
url.courserubrics=/${vs}/course-rubrics
url.rubricgrades=/${vs}/rubric-grades
url.enrollments=/${vs}/enrollments
url.classes=/${vs}/classes
url.studentclasspreferences=/${vs}/studentclasspreferences
# ===================== ASSIGNMENTS =====================
url.assignments=/${vs}/assignments
url.studentassignments=/${vs}/studentassignments
# ===================== STUDY PLANS =====================
url.studyplans=/${vs}/studyplans
# ===================== imagen =====================
url.imageprocessing=/${vs}/imageprocessing
# ===================== IA (AI) =====================
url.ia=/${vs}/ia

# ===================== ALERTS =====================
url.alerts=/${vs}/alerts
